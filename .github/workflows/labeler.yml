name: PR Labeler

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  label:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@v5

      - name: Add needs-review label
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: needs-review